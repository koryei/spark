<!doctype html>
<html lang="en" data-state="awake">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spark: wake and sleep your home server from the menu bar</title>
<meta name="description" content="Spark is a macOS menu bar app that wakes your home server with Wake-on-LAN and suspends it over SSH.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e1822'/%3E%3Cpath d='M16 3c1 8 5 12 13 13-8 1-12 5-13 13-1-8-5-12-13-13 8-1 12-5 13-13z' fill='%23ff5a1f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=sentient@400,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #6bb4ee;
  --ink: #0e1822;
  --muted: #0e1822;
  --accent: #ff5a1f;
  --accent-ink: #0e1822;
  --menu: #ffffff;
  --menu-ink: #0e1822;
  --menu-hover: #e4f1fc;

  --step-small: clamp(0.875rem, 0.84rem + 0.1vw, 0.9375rem);
  --step-body: clamp(1.125rem, 1.05rem + 0.3vw, 1.3125rem);
  --step-display: 11vw;

  --margin: clamp(16px, 2.2vw, 32px);
  --ease: cubic-bezier(.2, .7, .1, 1);
}
html[data-state="asleep"] {
  --bg: #0e1822;
  --ink: #ffffff;
  --menu: #1b2a38;
  --menu-ink: #ffffff;
  --menu-hover: #26394b;
}

* { box-sizing: border-box; margin: 0; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  min-height: 100svh;
  background: var(--bg);
  color: var(--ink);
  font-family: "Sentient", Georgia, serif;
  font-weight: 400;
  font-size: var(--step-body);
  line-height: 1.55;
  transition: background-color .6s var(--ease), color .6s var(--ease);
}

.page {
  min-height: 100svh;
  padding: var(--margin);
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: clamp(32px, 6vh, 72px);
}

/* top bar: wordmark and the one action */
.bar { display: flex; justify-content: space-between; align-items: center; }
.wordmark { font-weight: 500; font-size: 1.25rem; letter-spacing: -0.01em; text-decoration: none; color: inherit; }

/* the sentence */
h1 {
  align-self: center;
  font-weight: 500;
  font-size: var(--step-display);
  line-height: .98;
  letter-spacing: -0.035em;
  text-wrap: nowrap;
}
h1 .line { display: flex; align-items: baseline; white-space: nowrap; }
h1 .line + .line { margin-top: .1em; }
.gap { display: inline-block; width: .22em; }

.switch {
  appearance: none; border: 0; padding: 0; cursor: pointer; font: inherit;
  position: relative;
  display: inline-block;
  width: 1.75em; height: .8em;
  border-radius: .4em;
  background: var(--ink);
  color: var(--bg);
  align-self: baseline;
  transform: translateY(.02em);
  transition: transform .2s var(--ease);
}
.switch:active { transform: translateY(.02em) scale(.97); }
.switch .thumb {
  position: absolute; top: .08em; left: .08em;
  width: .64em; height: .64em; border-radius: 50%;
  background: var(--bg);
  transition: transform .45s var(--ease);
}
html[data-state="awake"] .switch .thumb { transform: translateX(.95em); }
.switch:focus-visible, .btn:focus-visible, .row:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }

/* bottom row */
.foot { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: var(--margin); align-items: end; }
.pitch { grid-column: 1 / span 5; }
.pitch p { max-width: 36ch; font-size: var(--step-body); }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  margin-top: 28px; min-height: 56px; padding: 0 28px;
  background: var(--accent); color: var(--accent-ink);
  font: 500 1.0625rem/1 "Sentient", Georgia, serif;
  text-decoration: none; border-radius: 0;
  transition: transform .2s var(--ease);
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(1px) scale(.98); }

/* the app's own menu, at true size */
.menu {
  grid-column: 9 / span 4;
  justify-self: end;
  width: min(100%, 300px);
  background: var(--menu); color: var(--menu-ink);
  border-radius: 12px; padding: 8px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  font-size: 14px; line-height: 1.3;
  transition: background-color .6s var(--ease), color .6s var(--ease);
  clip-path: inset(0 0 0 0);
}
.menu .head { padding: 8px 10px 10px; display: flex; justify-content: space-between; align-items: baseline; }
.menu .head b { font-weight: 600; }
.menu .status { font-size: 13px; font-variant-numeric: tabular-nums; }
.row {
  display: flex; justify-content: space-between; align-items: center; width: 100%;
  appearance: none; border: 0; background: transparent; color: inherit; font: inherit;
  padding: 10px; border-radius: 6px; cursor: pointer; text-align: left;
  transition: background-color .15s var(--ease), transform .15s var(--ease);
}
.row:hover { background: var(--menu-hover); }
.row:active { transform: scale(.985); }
.row[aria-disabled="true"] { opacity: .45; cursor: default; }
.row[aria-disabled="true"]:hover { background: transparent; }
.row small { font-size: 13px; opacity: .8; }

/* entrance and the shutter */
@media (prefers-reduced-motion: no-preference) {
  .rise { opacity: 0; transform: translateY(24px); animation: rise .8s var(--ease) forwards; animation-delay: calc(var(--i, 0) * 80ms + 100ms); }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .menu { animation: shutter 1.1s var(--ease) .5s backwards; }
  @keyframes shutter { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
}

@media (max-width: 760px) {
  .foot { display: flex; flex-direction: column; align-items: stretch; gap: 40px; }
  .btn { width: 100%; }
  .menu { align-self: stretch; width: 100%; }
}
</style>
</head>
<body>
<div class="page">
  <header class="bar">
    <a class="wordmark rise" style="--i:0" href="#top">Spark</a>
  </header>

  <h1 id="top">
    <span class="line rise" style="--i:1">Wake your server.</span>
    <span class="line rise" style="--i:2">Let it<span class="gap"></span><button class="switch" id="switch" role="switch" aria-checked="true" aria-label="Server power"><span class="thumb"></span></button></span>
  </h1>

  <div class="foot">
    <div class="pitch">
      <p class="rise" style="--i:3">A menu bar app that wakes your home server with Wake-on-LAN and suspends it over SSH, so it only draws power when you use it.</p>
      <a class="btn rise" style="--i:4" href="https://github.com/koryei/spark/releases/latest/download/Spark.zip">Download for Mac</a>
    </div>

    <div class="menu" data-ui aria-label="Spark menu preview">
      <div class="head"><b>Spark</b><span class="status" id="status" role="status" aria-live="polite">homeserver · Awake</span></div>
      <button class="row" id="wake" type="button"><span>Wake server</span><small>Wake-on-LAN</small></button>
      <button class="row" id="sleep" type="button"><span>Sleep server</span><small>systemctl suspend</small></button>
    </div>
  </div>
</div>

<script>
(function () {
  var root = document.documentElement;
  var sw = document.getElementById('switch');
  var wake = document.getElementById('wake');
  var sleep = document.getElementById('sleep');
  var status = document.getElementById('status');

  function set(state) {
    root.setAttribute('data-state', state);
    var awake = state === 'awake';
    sw.setAttribute('aria-checked', String(awake));
    status.textContent = 'homeserver · ' + (awake ? 'Awake' : 'Asleep');
    wake.setAttribute('aria-disabled', String(awake));
    sleep.setAttribute('aria-disabled', String(!awake));
  }
  function current() { return root.getAttribute('data-state'); }

  sw.addEventListener('click', function () { set(current() === 'awake' ? 'asleep' : 'awake'); });
  wake.addEventListener('click', function () { set('awake'); });
  sleep.addEventListener('click', function () { set('asleep'); });
  set('awake');
})();
</script>
</body>
</html>
